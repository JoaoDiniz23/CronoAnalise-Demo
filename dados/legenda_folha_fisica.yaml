# Legenda FICTÍCIA da folha de coleta (versão de demonstração).
#
# No projeto real, esta legenda é extraída do molde oficial da folha de
# coleta do cliente. Aqui os códigos e descrições foram substituídos por
# uma taxonomia bancária genérica, mantendo apenas a ESTRUTURA usada pelo
# código: classificação de 1 a 20 sem o código 7 (o 7 é pulado para não
# ser confundido com o 1 na leitura de folha manuscrita).

